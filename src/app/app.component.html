<div class="page-wrapper">

    <div class="background-layer" [ngClass]="backgroundClass"></div>

    <div class="page-content">

        @if (!isVideoOfferPage() && !isPredigtDetailPage()) {
        <app-header></app-header>
        }

        <div class="centered-content">
            <router-outlet />
            @if (isVideoOfferPage() || isPredigtDetailPage()) {
            <app-header style="position: fixed; width: 100vw;"></app-header>
            }
        </div>

        <app-toast></app-toast>

        @if (shouldShowFooter()){
        <app-footer></app-footer>
        }
    </div>

</div>
